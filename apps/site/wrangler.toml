# Cloudflare Pages project config.
# Deploy (done by CI): wrangler pages deploy dist --project-name=jinawong-site
name = "jinawong-site"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

[vars]
# The contact Pages Function (functions/api/contact.ts) stays off until this is "true"
# AND the secrets TURNSTILE_SECRET_KEY and CONTACT_WEBHOOK_URL are set:
#   wrangler pages secret put TURNSTILE_SECRET_KEY --project-name=jinawong-site
#   wrangler pages secret put CONTACT_WEBHOOK_URL  --project-name=jinawong-site
CONTACT_ENABLED = "false"
